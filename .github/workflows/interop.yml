# The interop grid: our agent against our mock Company, lenient and strict,
# and against Print with Poppy, an independent Company at a pinned commit,
# in containers behind the recording proxy (interop/).
# Docker makes it slow, so it runs on pushes to main and on pull requests
# only when something the grid builds or runs has changed: the Poppy client
# (and the config error it imports), the validator, the mock Company, the
# harness, the dependencies, or this file.
name: Interop

on:
  push:
    branches: [main]
    paths:
      - "src/poppy/**"
      - "src/validator/**"
      - "src/config.ts"
      - "spec/**"
      - "test/mock-company/**"
      - "interop/**"
      - "package*.json"
      - ".github/workflows/interop.yml"
  # The same paths as for push.
  pull_request:
    paths:
      - "src/poppy/**"
      - "src/validator/**"
      - "src/config.ts"
      - "spec/**"
      - "test/mock-company/**"
      - "interop/**"
      - "package*.json"
      - ".github/workflows/interop.yml"

permissions:
  contents: read

concurrency:
  group: interop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interop:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Honest agents and Companies, including injected network faults
        run: npm run interop -- --agents pda --companies lenient-company,strict-company --require-supported --scenarios D,S0,N,SD,SV,SVN,SM,SMC,SX,SXV,C,CL,CC,CI,CS,CA,SO,O,OX,OU,SE,R,AO,AM,AS,RL,DP,H,DC,W,CM,ML,CDUP,CIDUP,ODUP,NREP

      # The lenient and strict agents too: each reads the store's documents and tokens differently.
      - name: An independent Company, Print with Poppy at its pinned commit
        run: npm run interop -- --agents pda,lenient-personal-agent,strict-personal-agent --companies print-with-poppy --require-supported --scenarios D,S0,OU,CM,SD,SX,SMC,SO,AO,AS

      - name: Our agent refuses malicious Company responses
        run: npm run interop -- --agents pda --companies evil-company --require-supported --scenarios XH,XI,BX,XB,XN,XP,XE,XR

      - name: Our Companies refuse malicious agent requests
        run: npm run interop -- --agents evil-personal-agent --companies lenient-company,strict-company --require-supported --scenarios YR,YD,YA,YT,YS,YK,YU,YM

      - name: Upload the grid, HAR files and container logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          retention-days: 7
          name: interop-results
          path: interop/results/
          if-no-files-found: ignore
