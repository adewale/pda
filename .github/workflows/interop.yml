# The interop grid for our own pair: our agent against our mock Company,
# lenient and strict, in containers behind the recording proxy (interop/).
# Docker makes it slow, so it runs on pushes to main and on pull requests
# only when something the grid builds or runs has changed: the Poppy client
# (and the config error it imports), the validator, the mock Company, the
# harness, the dependencies, or this file.
name: Interop

on:
  push:
    branches: [main]
    paths:
      - "src/poppy/**"
      - "src/validator/**"
      - "src/config.ts"
      - "test/mock-company/**"
      - "interop/**"
      - "package*.json"
      - ".github/workflows/interop.yml"
  # The same paths as for push.
  pull_request:
    paths:
      - "src/poppy/**"
      - "src/validator/**"
      - "src/config.ts"
      - "test/mock-company/**"
      - "interop/**"
      - "package*.json"
      - ".github/workflows/interop.yml"

permissions:
  contents: read

concurrency:
  group: interop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interop:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci --legacy-peer-deps

      - run: npm run interop -- --agents pda --companies pda-mock,pda-mock-strict

      - name: Upload the grid, HAR files and container logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: interop-results
          path: interop/results/
          if-no-files-found: ignore
