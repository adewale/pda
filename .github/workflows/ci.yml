# Types, tests and the docs check on every push and pull request.
# The tests need no secrets: the Vitest config generates fresh keys, and
# Google, GitHub, the model and Companies are all faked. Nothing deploys here.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json engines: >=22.18
          node-version: 22.x
          cache: npm

      # agents declares many optional peers.
      - run: npm ci --legacy-peer-deps

      - run: npm run typecheck

      # Resetting every Durable Object belongs only in test/durability, which
      # has its own runtime; elsewhere it resets other files' objects mid-test.
      - name: No global Durable Object resets in the shared runtime
        run: "! grep -rnE '(abort|evict|delete)AllDurableObjects\\(' test --exclude-dir=durability"

      - run: npm test

      # Appendix A's test names and the docs' test counts match the suite.
      - run: npm run check:docs

  # The interop grid for our own pair: our agent against our mock
  # Company, lenient and strict, in containers behind the recording proxy (interop/).
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci --legacy-peer-deps

      - run: npm run interop -- --agents dpa --companies dpa-mock,dpa-mock-strict

      - name: Upload the grid, HAR files and container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-results
          path: interop/results/
          if-no-files-found: ignore
