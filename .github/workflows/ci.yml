# Docs and tooling on every PR; runtime checks on code/config changes.
# Main runs all steps. Keep this workflow present for required status checks.
# The tests need no secrets: the Vitest config generates fresh keys, and
# Google, GitHub, the model and Companies are all faked. Nothing deploys here.
# The Docker interop grid is its own workflow, interop.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Select checks
        id: scope
        run: node scripts/ci-scope.mjs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # package.json engines: >=24; .nvmrc: 24 (the newest LTS line)
          node-version: 24.x
          cache: npm

      - run: npm run test:tooling

      - run: npm run check:docs

      # agents declares many optional peers.
      - if: steps.scope.outputs.runtime == 'true'
        run: npm ci --legacy-peer-deps

      - run: npm run check:spec

      - if: steps.scope.outputs.runtime == 'true'
        run: npm run typecheck

      # Keep whole-runtime resets in the durability suite as an explicit policy.
      # File workers are currently isolated; this boundary also permits future pooling.
      - name: Whole-runtime resets belong in durability tests
        if: steps.scope.outputs.runtime == 'true'
        run: "! grep -rnE '(abort|evict|delete)AllDurableObjects\\(' test --exclude-dir=durability"

      - if: steps.scope.outputs.runtime == 'true'
        run: npm test

      - name: Approval recovery after actual PDA process termination
        if: steps.scope.outputs.specialist == 'true'
        run: npm run check:approval-crashes -- --output "$RUNNER_TEMP/approval-crashes.json"
        env:
          WRANGLER_SEND_METRICS: "false"
          XDG_CONFIG_HOME: ${{ runner.temp }}/pda-process-crash-wrangler

      - name: Hosted dummy Company requires real consent and fails closed
        if: steps.scope.outputs.specialist == 'true'
        run: node test/hosted/company-security.node.mjs
        env:
          WRANGLER_SEND_METRICS: "false"
          XDG_CONFIG_HOME: ${{ runner.temp }}/pda-hosted-wrangler

      - name: Pinned upstream Company kit and reviewed findings
        if: steps.scope.outputs.specialist == 'true'
        run: node scripts/check-company-kit.mjs --protocol 0.3 --reviewed-findings --output "$RUNNER_TEMP/company-kit.json"
        env:
          WRANGLER_SEND_METRICS: "false"
          XDG_CONFIG_HOME: ${{ runner.temp }}/pda-company-kit-wrangler

      - name: Pinned upstream 0.4 Company kit and reviewed findings
        if: steps.scope.outputs.specialist == 'true'
        run: node scripts/check-company-kit.mjs --protocol 0.4 --reviewed-findings --output "$RUNNER_TEMP/company-kit-0.4.json"
        env:
          WRANGLER_SEND_METRICS: "false"
          XDG_CONFIG_HOME: ${{ runner.temp }}/pda-company-kit-04-wrangler

      - name: Separate DPoP-capable kit copy and independent proof controls
        if: steps.scope.outputs.specialist == 'true'
        run: node scripts/check-company-kit.mjs --protocol 0.3 --with-dpop --reviewed-findings --output "$RUNNER_TEMP/company-kit-dpop.json"
        env:
          WRANGLER_SEND_METRICS: "false"
          XDG_CONFIG_HOME: ${{ runner.temp }}/pda-company-kit-dpop-wrangler

      - name: Upload upstream Company-kit results
        if: always() && steps.scope.outputs.specialist == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          retention-days: 7
          name: company-kit-results
          path: |
            ${{ runner.temp }}/company-kit.json
            ${{ runner.temp }}/company-kit-0.4.json
            ${{ runner.temp }}/company-kit-dpop.json
            ${{ runner.temp }}/approval-crashes.json
          if-no-files-found: ignore
