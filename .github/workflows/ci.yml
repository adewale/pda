# Types, tests and the docs check on pushes to main and on pull requests
# (a branch with an open pull request runs once, as the pull request).
# The tests need no secrets: the Vitest config generates fresh keys, and
# Google, GitHub, the model and Companies are all faked. Nothing deploys here.
# The Docker interop grid is its own workflow, interop.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # package.json engines: >=24; .nvmrc: 24 (the newest LTS line)
          node-version: 24.x
          cache: npm

      # agents declares many optional peers.
      - run: npm ci --legacy-peer-deps

      - run: npm run typecheck

      # Resetting every Durable Object belongs only in test/durability, which
      # has its own runtime; elsewhere it resets other files' objects mid-test.
      - name: No global Durable Object resets in the shared runtime
        run: "! grep -rnE '(abort|evict|delete)AllDurableObjects\\(' test --exclude-dir=durability"

      - run: npm test

      # Every test Appendix A and docs/adversarial-interop.md name exists.
      - run: npm run check:docs
