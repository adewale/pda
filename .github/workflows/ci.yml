# Types, tests and the docs check on pushes to main and on pull requests
# (a branch with an open pull request runs once, as the pull request).
# The tests need no secrets: the Vitest config generates fresh keys, and
# Google, GitHub, the model and Companies are all faked. Nothing deploys here.
# The Docker interop grid is its own workflow, interop.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # package.json engines: >=24; .nvmrc: 24 (the newest LTS line)
          node-version: 24.x
          cache: npm

      # agents declares many optional peers.
      - run: npm ci --legacy-peer-deps

      - run: npm run check:spec

      - run: npm run typecheck

      # Keep whole-runtime resets in the durability suite as an explicit policy.
      # File workers are currently isolated; this boundary also permits future pooling.
      - name: Whole-runtime resets belong in durability tests
        run: "! grep -rnE '(abort|evict|delete)AllDurableObjects\\(' test --exclude-dir=durability"

      # Runs all test projects, then checks documented references using the
      # names already discovered in this invocation. No second workerd startup.
      - run: npm test

      - name: Approval recovery after actual PDA process termination
        run: npm run check:approval-crashes -- --output "$RUNNER_TEMP/approval-crashes.json"
        env:
          WRANGLER_SEND_METRICS: "false"
          XDG_CONFIG_HOME: ${{ runner.temp }}/pda-process-crash-wrangler

      - name: Hosted dummy Company requires real consent and fails closed
        run: node test/hosted/company-security.node.mjs
        env:
          WRANGLER_SEND_METRICS: "false"
          XDG_CONFIG_HOME: ${{ runner.temp }}/pda-hosted-wrangler

      - name: Pinned upstream Company kit and reviewed findings
        run: node scripts/check-company-kit.mjs --reviewed-findings --output "$RUNNER_TEMP/company-kit.json"
        env:
          WRANGLER_SEND_METRICS: "false"
          XDG_CONFIG_HOME: ${{ runner.temp }}/pda-company-kit-wrangler

      - name: Separate DPoP-capable kit copy and independent proof controls
        run: node scripts/check-company-kit.mjs --with-dpop --reviewed-findings --output "$RUNNER_TEMP/company-kit-dpop.json"
        env:
          WRANGLER_SEND_METRICS: "false"
          XDG_CONFIG_HOME: ${{ runner.temp }}/pda-company-kit-dpop-wrangler

      - name: Upload upstream Company-kit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: company-kit-results
          path: |
            ${{ runner.temp }}/company-kit.json
            ${{ runner.temp }}/company-kit-dpop.json
            ${{ runner.temp }}/approval-crashes.json
          if-no-files-found: ignore
