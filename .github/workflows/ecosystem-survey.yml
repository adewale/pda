name: Ecosystem survey

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-survey
  cancel-in-progress: false

jobs:
  survey:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Select Chromium for rendered evidence
        run: |
          node --input-type=module <<'JS'
          import {existsSync,appendFileSync} from 'node:fs';
          import {createRequire} from 'node:module';
          let binary=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(existsSync);
          if(!binary){
            const require=createRequire(import.meta.resolve('@cloudflare/puppeteer'));
            const {install,resolveBuildId,Browser,detectBrowserPlatform}=await import(require.resolve('@puppeteer/browsers'));
            const platform=detectBrowserPlatform();
            const buildId=await resolveBuildId(Browser.CHROME,platform,'stable');
            binary=(await install({browser:Browser.CHROME,platform,buildId,cacheDir:'/tmp/ecosystem-chromium'})).executablePath;
          }
          appendFileSync(process.env.GITHUB_ENV,`PDA_ACCEPTANCE_CHROMIUM=${binary}\n`);
          JS
      - name: Read sources and public discovery documents
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run ecosystem:survey -- --out /tmp/ecosystem-survey
      - name: Capture the current map before changing its data
        run: node scripts/app-smoke.mjs --ecosystem-viewport --output /tmp/ecosystem-before.json
      - name: Prepare dated evidence PR
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "Ecosystem survey"
          git config user.email "ecosystem-survey@example.com"
          survey_date=$(date -u +%F)
          survey_branch="ecosystem/survey-$survey_date"
          if git ls-remote --exit-code --heads origin "$survey_branch" >/dev/null; then
            git fetch origin "$survey_branch"
            git switch -c "$survey_branch" "origin/$survey_branch"
            git merge --no-edit "origin/$DEFAULT_BRANCH"
          else
            git switch -c "$survey_branch"
          fi
          evidence="docs/evidence/ecosystem-$survey_date"
          mkdir -p "$evidence"
          cp /tmp/ecosystem-survey.json "$evidence/survey.json"
          cp /tmp/ecosystem-survey.md "$evidence/survey.md"
          cp /tmp/ecosystem-survey.json docs/ecosystem-status.json
          cp /tmp/ecosystem-survey.md docs/ecosystem-status.md
          node scripts/ecosystem-map.mjs
          node scripts/app-smoke.mjs --ecosystem-viewport --output /tmp/ecosystem-after.json
          cp /tmp/ecosystem-before.json.ecosystem.png "$evidence/before.png"
          cp /tmp/ecosystem-after.json.ecosystem.png "$evidence/after.png"
          cp /tmp/ecosystem-after.json.ecosystem-mobile.png "$evidence/mobile.png"
          cp /tmp/ecosystem-after.json "$evidence/browser-checks.json"
          git add docs/ecosystem.md docs/ecosystem-status.json docs/ecosystem-status.md "$evidence"
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="Ecosystem survey" -c user.email="ecosystem-survey@example.com" commit -m "Record the $survey_date public ecosystem survey"
          git push origin "$survey_branch"
          node scripts/ecosystem-pr-body.mjs "$evidence" > /tmp/ecosystem-pr.md
          existing_pr=$(gh pr list --head "$survey_branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --title "Refresh the ecosystem survey for $survey_date" --body-file /tmp/ecosystem-pr.md
          else
            gh pr create --base "$DEFAULT_BRANCH" --head "$survey_branch" --title "Refresh the ecosystem survey for $survey_date" --body-file /tmp/ecosystem-pr.md
          fi
          # GITHUB_TOKEN-created PRs do not trigger pull_request workflows.
          gh workflow run ci.yml --ref "$survey_branch"
