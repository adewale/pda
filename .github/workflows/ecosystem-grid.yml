name: Ecosystem cross-project grid

on:
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch:
    inputs:
      peers:
        description: "Comma-separated reviewed peer names; empty selects all local honest peers"
        required: false
        default: ""
  pull_request:
    paths:
      - "interop/registry.json"
      - "interop/impls/**"
      - "scripts/ecosystem-grid.mjs"
      - ".github/workflows/ecosystem-grid.yml"

permissions:
  contents: read

concurrency:
  group: ecosystem-grid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PEERS: ${{ inputs.peers }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$BASE_SHA" ]; then args+=(--base "$BASE_SHA"); fi
          if [ -n "$PEERS" ]; then args+=(--peers "$PEERS"); fi
          node scripts/ecosystem-grid.mjs "${args[@]}" > /tmp/matrix.json
          echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"
          node --input-type=module -e 'import fs from "node:fs"; console.log("count=" + JSON.parse(fs.readFileSync("/tmp/matrix.json")).include.length)' >> "$GITHUB_OUTPUT"
  peer:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Reserve swap for large compiler jobs
        if: matrix.peer == 'everruns'
        run: |
          sudo fallocate -l 6G /swapfile-ecosystem
          sudo chmod 600 /swapfile-ecosystem
          sudo mkswap /swapfile-ecosystem
          sudo swapon /swapfile-ecosystem
      - name: Exercise one peer at its reviewed pin
        id: run
        env:
          AGENTS: ${{ matrix.agents }}
          COMPANIES: ${{ matrix.companies }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          scenarios=$(node scripts/ecosystem-grid.mjs --scenarios)
          if [ "$EVENT_NAME" = pull_request ]; then scenarios=D,S0; fi
          # New findings may need private disclosure (SECURITY.md). Do not print
          # raw traces or upload an unexpected failure from a public workflow.
          run_status=0
          npm run interop -- --agents "$AGENTS" --companies "$COMPANIES" --scenarios "$scenarios" --build-jobs 1 --out interop/results/ecosystem > /tmp/ecosystem-grid.log 2>&1 || run_status=$?
          if [ ! -f interop/results/ecosystem/results.json ]; then
            echo "Cross-project run needs local review. Raw results are withheld under SECURITY.md." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          node scripts/ecosystem-grid-receipt.mjs interop/results/ecosystem/results.json > /tmp/ecosystem-grid-receipt.json
          echo "exit_code=$run_status" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ecosystem-${{ matrix.id }}
          path: /tmp/ecosystem-grid-receipt.json
          retention-days: 90
      - name: Keep unexempted compatibility failures visible
        if: steps.run.outputs.exit_code != '0'
        run: exit 1
  report:
    needs: [plan, peer]
    if: always() && !cancelled() && needs.plan.outputs.count != '0' && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - uses: actions/download-artifact@v7
        with:
          pattern: ecosystem-*
          path: /tmp/ecosystem-receipts
      - name: Prepare dated grid report PR
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_JOBS: ${{ needs.plan.outputs.count }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          node scripts/ecosystem-grid-receipt.mjs --aggregate /tmp/ecosystem-receipts /tmp/ecosystem-grid "$EXPECTED_JOBS"
          git config user.name "Ecosystem grid"
          git config user.email "ecosystem-grid@example.com"
          grid_date=$(date -u +%F)
          grid_branch="ecosystem/grid-$grid_date"
          if git ls-remote --exit-code --heads origin "$grid_branch" >/dev/null; then
            git fetch origin "$grid_branch"
            git switch -c "$grid_branch" "origin/$grid_branch"
            git merge --no-edit "origin/$DEFAULT_BRANCH"
          else
            git switch -c "$grid_branch"
          fi
          evidence="docs/evidence/ecosystem-grid-$grid_date"
          mkdir -p "$evidence"
          cp /tmp/ecosystem-grid.json "$evidence/grid.json"
          cp /tmp/ecosystem-grid.md "$evidence/grid.md"
          git add "$evidence"
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="Ecosystem grid" -c user.email="ecosystem-grid@example.com" commit -m "Record the $grid_date cross-project grid"
          git push origin "$grid_branch"
          cat > /tmp/ecosystem-grid-pr.md <<'BODY'
          Record dated aggregate outcomes from the honest cross-project grid at reviewed registry pins.

          The report separates passes, retained known failures, unsupported scenarios and flaky passes. It covers PDA against local Company adapters and peer Personal Agents against our matching-profile mock. It is not the full foreign-to-foreign matrix or a live journey.

          Only complete runs without unreviewed failures are published. Previously published compatibility findings remain unexempted and still fail the grid job. Raw traces are withheld; findings needing private disclosure follow SECURITY.md. Review the checked commits before updating the ecosystem's historical scorecard.
          BODY
          existing_pr=$(gh pr list --head "$grid_branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --title "Record cross-project interoperability for $grid_date" --body-file /tmp/ecosystem-grid-pr.md
          else
            gh pr create --base "$DEFAULT_BRANCH" --head "$grid_branch" --title "Record cross-project interoperability for $grid_date" --body-file /tmp/ecosystem-grid-pr.md
          fi
          gh workflow run ci.yml --ref "$grid_branch"
